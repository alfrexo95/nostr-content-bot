name: nostr-content
on:
  schedule:
    - cron: "17 15 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = solo mostrar, sin publicar"
        default: "1"
concurrency:
  group: nostr-content
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python content.py
      - name: Guardar estado
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "estado $(date -u +%F-%H%M)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
